# Neues Projekt: Spec, Architektur (immer), Umgebung, Slice-Planung, rote Slice-Tests, Gates 3-6, zwei Freigaben.
# Ausgefuehrt vom Orchestrator als feste Zustandsmaschine; `when` wertet Code aus (activePhases).
name: new-project
phases:
  - name: setup            # Worktree + Branch usac/<id>
  - name: spec             # Anforderungen klaeren
    role: analyst
  - name: approve_spec     # Freigabe der Spec
    approval: spec
  - name: design           # Architektur-Vorschlag + ADR, unabhaengig von der Groesse
    role: architect
    approval: design
  - name: environment      # Build, Abhaengigkeiten, Werkzeuge einrichten (Gates 1-2 gruen)
    role: environment-engineer
  - name: plan             # Rueckwaerts-Planung in Slices
    role: tech-lead
  - name: acceptance       # Slice-Tests muessen ROT sein
    role: test-engineer
    variant: acceptance
    expect: gate_fails
  - name: approve_h1       # Freigabe der Slice-Tests
    approval: h1
  - name: lock             # Hash sperren, Tests committen
  - name: implement        # bis Gates 1-2 + Abnahmetest gruen
    role: implementer
    until: [format, lint, unit, acceptance]
    max_attempts: 6
  - name: qa               # QA gegen die lokale Preview, nur mit Preview im Profil
    role: qa-engineer
    when:
      preview: true
  - name: verify           # Gate-Stufen 3-6
  - name: review           # frischer Kontext, Belegpflicht
    role: code-reviewer
    block_on: [critical, high]
  - name: integrate        # Conventional Commit der Implementierung vor dem Push
  - name: push
  - name: pr
  - name: approve_h2       # Freigabe vor Merge
    approval: h2
  - name: merge
escalation: default
