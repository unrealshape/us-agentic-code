# Bugfix-Workflow (Phase 0): rueckwaerts entwickeln.
# Ausgefuehrt vom Orchestrator als feste Zustandsmaschine.
name: bugfix
phases:
  - name: setup            # Worktree + Branch usac/<id>
  - name: acceptance       # Abnahmetest muss ROT sein
    role: test-engineer
    variant: acceptance
    expect: gate_fails
  - name: approve_h1       # Freigabe der Abnahmetests
    approval: h1
  - name: lock             # Hash sperren, Test committen
  - name: implement        # bis Gates 1-2 + Abnahmetest gruen
    role: implementer
    until: [format, lint, unit, acceptance]
    max_attempts: 6
  - name: review           # frischer Kontext, Belegpflicht
    role: code-reviewer
    block_on: [critical, high]
  - name: integrate        # Conventional Commit auf dem Branch
escalation: default
