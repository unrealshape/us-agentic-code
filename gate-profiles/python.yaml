# Gate-Profil fuer Python-Projekte (ruff, pytest). Belege: docs/adr/0007-stack-profile.md
name: python
detect: ["**/*.py", "pyproject.toml"]
test_globs: ["tests/**", "test/**", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
protected_globs: ["pyproject.toml", "pytest.ini", "ruff.toml", ".ruff.toml", "setup.cfg", "tox.ini", ".usac/**", ".github/**"]
skip_markers: ["@pytest.mark.skip", "pytest.skip(", "@unittest.skip", "xfail"]

# Paket-Registry (pip); siehe ADR 0005.
network_allow: ["pypi.org", "files.pythonhosted.org"]

acceptance:
  run: "pytest -q {files}"
  # Import-/Syntaxfehler beim Sammeln sind kein inhaltlich roter Test.
  build_error_patterns: ["ERROR collecting", "ModuleNotFoundError", "SyntaxError"]

stages:
  # geprueft: ruff 0.17.5 (`ruff format --check`, `ruff check`), pytest 9.2.0 (`-q`)
  - name: format
    run: "ruff format --check ."
    stage: 1
    optional: true
  - name: lint
    run: "ruff check ."
    stage: 1
  - name: unit
    run: "pytest -q"
    stage: 1
