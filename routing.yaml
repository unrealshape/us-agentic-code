# Modell-Routing von US-AGENTIC-CODE.
# Grundsatz: jede Aufgabe bekommt das guenstigste Modell, das sie sicher schafft.
# Leiter: haiku < sonnet < opus < fable
#
# Entscheidung (Stand 2026-11-18): Fable nur fuer sehr komplexe Architekturaufgaben.
# Opus steuert (Planung, Freigabe, Review), der Rest laeuft auf Haiku und Sonnet.

defaults:
  analyst: opus            # Steuerung: Spec und Anforderungen
  explorer: haiku
  architect: opus          # Fable nur hier, siehe fable.only_roles
  tech-lead: opus          # Steuerung: Rueckwaerts-Planung in Slices
  test-engineer:
    acceptance: sonnet
    slices: sonnet
  implementer: sonnet
  build-fixer: sonnet
  environment-engineer: sonnet
  code-reviewer: opus      # Steuerung: Review-Urteil
  security-reviewer: opus
  qa-engineer: sonnet
  integrator: haiku
  docs-writer: sonnet
  learner: haiku

raise:
  # Bei Groesse "large" eine Stufe hoeher (nur Architekt, damit Fable dort erreichbar ist).
  size_large: [architect]
  # Nach so vielen Fehlversuchen derselben Rolle eine Stufe hoeher.
  after_failures: 2

fable:
  # Fable ist nur fuer diese Rollen erlaubt; alle anderen werden auf Opus gedeckelt.
  only_roles: [architect]

budget:
  # Ab 75 % Kontingent braucht Fable eine Freigabe, ab 90 % hoechstens Sonnet.
  fable_needs_approval_above: 0.75
  only_sonnet_haiku_above: 0.90
  exempt: [security-reviewer]
